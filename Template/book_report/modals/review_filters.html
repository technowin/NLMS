<div class="modal fade" id="reviewFiltersModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Review Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="reviewForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Rating</label>
                                <select class="form-control" name="rating[]" multiple>
                                    <option value="1">1 Star</option>
                                    <option value="2">2 Stars</option>
                                    <option value="3">3 Stars</option>
                                    <option value="4">4 Stars</option>
                                    <option value="5">5 Stars</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Library</label>
                                <select class="form-control library-select" name="library[]" multiple></select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Book Title</label>
                                <input type="text" class="form-control" name="book_title" 
                                       placeholder="Enter book title...">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Catalogue</label>
                                <select class="form-control catalogue-select" name="catalogue[]" multiple></select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" 
                        onclick="clearTabFilters('review', 'reviewForm')">
                    Clear Filters
                </button>
                <button type="button" class="btn btn-primary" 
                        onclick="applyTabFilters('review', 'reviewForm')">
                    Apply Filters
                </button>
            </div>
        </div>
    </div>
</div>
