<div class="modal fade" id="accessionFiltersModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Accession Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="accessionForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control" name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control" name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Condition</label>
                                <select class="form-control condition-select" name="condition[]" multiple>
                                    <option value="">--Select--</option>
                                    {% for s in conditions %}
                                        <option value="{{ s.condition_id }}">
                                            {{ s.condition_at_entry }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Source</label>
                                <select class="form-control source-select" name="source[]" multiple>
                                    <option value="">--Select--</option>
                                    {% for s in sources %}
                                        <option value="{{ s.source_id }}">
                                            {{ s.funding_source_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <select class="form-control location-select" name="location[]" multiple>
                                    <option value="">--Select--</option>
                                    {% for s in locations %}
                                        <option value="{{ s.location_id }}">
                                            {{ s.location_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Supplier</label>
                                <select class="form-control supplier-select" name="supplier[]" multiple>
                                    <option value="">--Select--</option>
                                    {% for s in suppliers %}
                                        <option value="{{ s.supplier_id }}">
                                            {{ s.supplier_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            {% comment %} <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-control status-select" name="status[]" multiple></select>
                            </div> {% endcomment %}
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-12">
                            
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" 
                        onclick="applyTabFilters('accession', 'accessionForm')">
                    Apply Filters
                </button>
                <button type="button" class="btn btn-sm btn-danger" 
                        onclick="clearTabFilters('accession', 'accessionForm')">
                    Clear Filters
                </button>
            </div>
        </div>
    </div>
</div>
