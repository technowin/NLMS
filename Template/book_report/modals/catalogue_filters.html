<div class="modal fade" id="catalogueFiltersModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Catalogue Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="catalogueForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control" name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control" name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Language</label>
                                <select class="form-control language-select" name="language[]" multiple>
                                    <option value="">--Select--</option>
                                    <option value="English">English</option>
                                    <option value="हिंदी">Hindi</option>
                                    <option value="मराठी">Marathi</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Ebook Available</label>
                                <select class="form-select" name="ebook_available">
                                    <option value="">All</option>
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Subject</label>
                                <select class="form-control subject-select" name="subject[]" multiple>
                                    <option value="">--Select--</option>
                                    {% for s in subjects %}
                                        <option value="{{ s.id }}">
                                            {{ s.subjectNameEnglish }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Material Type</label>
                                <select class="form-control material_type-select" name="material_type[]" multiple>
                                    <option value="">--Select--</option>
                                    {% for s in material_type %}
                                        <option value="{{ s.id }}">
                                            {{ s.materialNameEnglish }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" 
                        onclick="applyTabFilters('catalogue', 'catalogueForm')">
                    Apply Filters
                </button>
                <button type="button" class="btn btn-sm btn-danger" 
                        onclick="clearTabFilters('catalogue', 'catalogueForm')">
                    Clear Filters
                </button>
            </div>
        </div>
    </div>
</div>
