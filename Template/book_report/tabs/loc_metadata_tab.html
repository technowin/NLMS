<div class="d-flex flex-column h-100">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <div>
            <h5 class="mb-0">
                <i class="bi bi-building me-2"></i>Library of Congress Metadata
                <small class="text-muted ms-2" id="loc-metadata-info">All LOC data</small>
                <small class="text-muted">
                    <a href="#" onclick="deselectAll()" class="text-danger">
                        <i class="bi bi-x-circle"></i> Clear 
                    </a>
                </small>
            </h5>
        </div>
        <div class="btn-group">
            <button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2 filter-btn" data-bs-toggle="modal" 
                    data-bs-target="#locMetadataFiltersModal">
                <i class="bi bi-funnel me-1"></i>Filters
                <span class="badge rounded-pill bg-light text-primary filter-badge" id="loc-metadata-filter-count">0</span>
            </button>
            &nbsp;&nbsp;&nbsp;
            <button class="btn btn-success btn-sm" onclick="exportCurrentTab()">
                <i class="bi bi-file-earmark-excel me-1"></i>Export
            </button>
        </div>
    </div>
    
     <div class="table-responsive table-scroll">
        <table class="table table-hover table-striped" id="loc-metadata-table">
            <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>ISBN</th>
                    <th>Created At</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div class="text-center py-5" id="loc-metadata-empty" style="display: none;">
        <i class="bi bi-building text-muted" style="font-size: 3rem;"></i>
        <p class="mt-2 text-muted">No LOC metadata found</p>
    </div>
</div>
