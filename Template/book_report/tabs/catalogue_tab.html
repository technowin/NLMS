<div class="d-flex flex-column h-100">
    <!-- Tab Header with Actions -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="mb-0">
                <i class="bi bi-journal me-2"></i>Catalogue Details
                <small class="text-muted ms-2" id="catalogue-info">Select books to view details</small>
            </h5>
        </div>
        <div class="btn-group">
            <button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2 filter-btn" data-bs-toggle="modal" 
                    data-bs-target="#catalogueFiltersModal">
                <i class="bi bi-funnel me-1"></i>Filters
                <span class="badge rounded-pill bg-light text-primary filter-badge" id="catalogue-filter-count">0</span>
            </button>
            &nbsp;&nbsp;&nbsp;
            <button class="btn btn-success btn-sm" onclick="exportCurrentTab()">
                <i class="bi bi-file-earmark-excel me-1"></i>Export
            </button>
        </div>
    </div>
    
    <!-- Table Container -->
     <div class="table-responsive table-scroll">
        <table class="table table-hover table-striped" id="catalogue-table">
            <thead class="table-light">
                <tr>
                    <th>Ref No</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN/ISSN</th>
                    <th>Language</th>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Subject</th>
                    <th>Ebook</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>
    
    <!-- No Data Message -->
    <div class="text-center py-5" id="catalogue-empty" style="display: none;">
        <i class="bi bi-journal-x text-muted" style="font-size: 3rem;"></i>
        <p class="mt-2 text-muted">No catalogue data found for selected books</p>
    </div>
</div>
