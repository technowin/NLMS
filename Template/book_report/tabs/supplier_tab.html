<div class="d-flex flex-column h-100">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <div>
            <h5 class="mb-0">
                <i class="bi bi-truck me-2"></i>Supplier Details
                <small class="text-muted ms-2" id="supplier-info">Select books to view details</small>
                <small class="text-muted">
                    <a href="#" onclick="deselectAll()" class="text-danger">
                        <i class="bi bi-x-circle"></i> Clear 
                    </a>
                </small>
            </h5>
        </div>
        <div class="btn-group">
            <button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2 filter-btn" data-bs-toggle="modal" 
                    data-bs-target="#supplierFiltersModal">
                <i class="bi bi-funnel me-1"></i>Filters
                <span class="badge rounded-pill bg-light text-primary filter-badge" id="supplier-filter-count">0</span>
            </button>
            &nbsp;&nbsp;&nbsp;
            <button class="btn btn-success btn-sm" onclick="exportCurrentTab()">
                <i class="bi bi-file-earmark-excel me-1"></i>Export
            </button>
        </div>
    </div>
    
     <div class="table-responsive table-scroll">
        <table class="table table-hover table-striped" id="supplier-table">
            <thead class="table-light">
                <tr>
                    <th>Accession No</th>
                    <th>Acquisition Date</th>
                    <th>Catalog Ref No</th>
                    <th>Book Title</th>
                    <th>Supplier Code</th>
                    <th>Supplier Name</th>
                    <th>Supplier Mobile</th>
                    <th>Supplier Email</th>
                    <th>Supplier Address</th>
                    <th>Supplier Pincode</th>
                    <th>Active Status</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </div>
    
    <div class="text-center py-5" id="supplier-empty" style="display: none;">
        <i class="bi bi-truck text-muted" style="font-size: 3rem;"></i>
        <p class="mt-2 text-muted">No supplier data found for selected books</p>
    </div>
</div>
