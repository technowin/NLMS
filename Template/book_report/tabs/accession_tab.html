<div class="d-flex flex-column h-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="mb-0">
                <i class="bi bi-box-seam me-2"></i>Accession Details
                <small class="text-muted ms-2" id="accession-info">Select books to view details</small>
            </h5>
        </div>
        <div class="btn-group">
            <button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2 filter-btn" data-bs-toggle="modal" 
                    data-bs-target="#accessionFiltersModal">
                <i class="bi bi-funnel me-1"></i>Filters
                <span class="badge rounded-pill bg-light text-primary filter-badge"id="accession-filter-count">0</span>
            </button>
            &nbsp;&nbsp;&nbsp;
            <button class="btn btn-success btn-sm" onclick="exportCurrentTab()">
                <i class="bi bi-file-earmark-excel me-1"></i>Export
            </button>
        </div>
    </div>
    
     <div class="table-responsive table-scroll">
        <table class="table table-hover table-striped" id="accession-table">
            <thead class="table-light">
                <tr>
                    <th>Accession No</th>
                    <th>Acquisition Date</th>
                    <th>Catalog Ref</th>
                    <th>Book Title</th>
                    <th>Copy No</th>
                    <th>Invoice No</th>
                    <th>Invoice Date</th>
                    <th>Price</th>
                    <th>Condition</th>
                    <th>Source</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Supplier</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div class="text-center py-5" id="accession-empty" style="display: none;">
        <i class="bi bi-box-seam text-muted" style="font-size: 3rem;"></i>
        <p class="mt-2 text-muted">No accession data found for selected books</p>
    </div>
</div>
