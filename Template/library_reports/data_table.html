<!-- reports/templates/library_reports/partials/data_table.html -->
<!-- This template is loaded dynamically -->
<div class="table-responsive">
    <table class="table table-sm table-hover table-striped" id="dataTable-{{ tab_id }}" width="100%">
        <thead class="table-light">
            <!-- Columns will be loaded dynamically -->
        </thead>
        <tbody>
            <!-- Data will be loaded dynamically -->
        </tbody>
        <tfoot>
            <tr>
                <td colspan="100%" class="text-center small text-muted">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            Showing <span id="startRecord">0</span> to <span id="endRecord">0</span> 
                            of <span id="totalRecords">0</span> records
                        </div>
                        <div class="spinner-border spinner-border-sm text-primary d-none" 
                             id="tableLoading" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<div class="no-data-alert alert alert-warning d-none" id="noDataAlert">
    <i class="bi bi-exclamation-triangle"></i>
    No data found for the selected criteria.
</div>
