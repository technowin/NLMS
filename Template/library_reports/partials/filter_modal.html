<!-- reports/templates/library_reports/partials/filter_modal.html -->
<!-- Global Filter Modal -->
<div class="modal fade" id="globalFilterModal" tabindex="-1" aria-labelledby="globalFilterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="globalFilterModalLabel">
                    <i class="bi bi-funnel me-1"></i> Global Report Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="globalFilterForm">
                    <div class="row">
                        <!-- Date Range -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date Range</label>
                            <div class="input-group input-group-sm">
                                <input type="date" class="form-control" name="from_date" id="globalFromDate">
                                <span class="input-group-text">to</span>
                                <input type="date" class="form-control" name="to_date" id="globalToDate">
                            </div>
                            <div class="mt-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary preset-date" data-days="0">Today</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary preset-date" data-days="-7">Last 7 Days</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary preset-date" data-days="-30">Last 30 Days</button>
                            </div>
                        </div>
                        
                        <!-- Membership Type -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Membership Type</label>
                            <select class="form-select form-select-sm filter-select" 
                                    name="membership_type" 
                                    multiple
                                    data-placeholder="Select membership types">
                                {% for type in membership_types %}
                                <option value="{{ type.id }}">{{ type.membership_type }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <!-- Status -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select form-select-sm filter-select" 
                                    name="status" 
                                    multiple
                                    data-placeholder="Select statuses">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        
                        <!-- Ward -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ward</label>
                            <select class="form-select form-select-sm filter-select" 
                                    name="ward" 
                                    multiple
                                    data-placeholder="Select wards">
                                {% for ward in wards %}
                                <option value="{{ ward }}">{{ ward }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <!-- Additional Filters -->
                    <div class="accordion mb-3" id="globalAdditionalFilters">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" 
                                        data-bs-toggle="collapse" 
                                        data-bs-target="#globalMoreFilters">
                                    Advanced Filters
                                </button>
                            </h2>
                            <div id="globalMoreFilters" class="accordion-collapse collapse">
                                <div class="accordion-body">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Member Type</label>
                                            <select class="form-select form-select-sm filter-select" 
                                                    name="member_type" 
                                                    multiple>
                                                {% for type in member_types %}
                                                <option value="{{ type.id }}">{{ type.parameter_name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Registration Method</label>
                                            <select class="form-select form-select-sm" name="registration_method">
                                                <option value="">All</option>
                                                <option value="online">Online</option>
                                                <option value="offline">Offline</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Min Age</label>
                                            <input type="number" class="form-control form-control-sm" 
                                                   name="min_age" min="0" max="100" placeholder="Minimum age">
                                        </div>
                                        
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Max Age</label>
                                            <input type="number" class="form-control form-control-sm" 
                                                   name="max_age" min="0" max="100" placeholder="Maximum age">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Saved Configurations -->
                    <div class="mb-3">
                        <label class="form-label">Saved Configurations</label>
                        <div class="input-group input-group-sm">
                            <select class="form-select" id="savedConfigSelect">
                                <option value="">Select saved configuration...</option>
                                <option value="default_active">Default: Active Members</option>
                                <option value="default_new_month">Default: New This Month</option>
                            </select>
                            <button class="btn btn-outline-primary" type="button" id="loadSavedConfig">
                                <i class="bi bi-upload"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="applyGlobalFilters">
                    <i class="bi bi-check-circle me-1"></i> Apply Filters
                </button>
                <button type="button" class="btn btn-outline-danger" id="clearGlobalFilters">
                    <i class="bi bi-x-circle me-1"></i> Clear All
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Tab Filter Modal -->
<div class="modal fade" id="tabFilterModal" tabindex="-1" aria-labelledby="tabFilterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tabFilterModalTitle">
                    <i class="bi bi-funnel me-1"></i> Tab Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="tabFilterForm">
                    <!-- Dynamic content will be loaded here -->
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="applyTabFilters">
                    <i class="bi bi-check-circle me-1"></i> Apply Filters
                </button>
                <button type="button" class="btn btn-outline-danger" id="clearTabFilters">
                    <i class="bi bi-x-circle me-1"></i> Clear
                </button>
            </div>
        </div>
    </div>
</div>
