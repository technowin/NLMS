<!-- reports/templates/library_reports/partials/report_tabs.html -->
<ul class="nav nav-tabs report-tabs" id="reportTabs" role="tablist">
    {% for tab in tabs_config %}
    <li class="nav-item" role="presentation">
        <button class="nav-link {% if forloop.first %}active{% endif %} report-tab" 
                id="tab-{{ tab.id }}-btn"
                data-bs-toggle="tab" 
                data-bs-target="#tab-{{ tab.id }}" 
                data-tab-id="{{ tab.id }}"
                type="button" 
                role="tab">
            <i class="bi {{ tab.icon }} me-1"></i>
            {{ tab.title }}
        </button>
    </li>
    {% endfor %}
</ul>

<!-- Tab Content Container -->
<div class="tab-content mt-3" id="reportTabContent">
    {% for tab in tabs_config %}
    <div class="tab-pane fade {% if forloop.first %}show active{% endif %}" 
         id="tab-{{ tab.id }}" 
         role="tabpanel">
         
        <!-- Tab Header with Actions -->
        <div class="tab-header d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0">{{ tab.title }} Report</h6>
            <div class="tab-actions">
                <button class="btn btn-sm btn-outline-secondary tab-filter-btn" 
                        data-tab="{{ tab.id }}">
                    <i class="bi bi-funnel"></i> Filters
                    <span class="badge bg-primary filter-count-badge d-none">0</span>
                </button>
                <button class="btn btn-sm btn-outline-success tab-export-btn" 
                        data-tab="{{ tab.id }}">
                    <i class="bi bi-file-earmark-excel"></i> Export
                </button>
                <button class="btn btn-sm btn-outline-primary reload-tab-btn" 
                        data-tab="{{ tab.id }}">
                    <i class="bi bi-arrow-clockwise"></i> Reload
                </button>
            </div>
        </div>
        
        <!-- Tab Content -->
        <div class="tab-content-container" id="content-{{ tab.id }}">
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i>
                Select members from the left panel to load {{ tab.title|lower }} data.
            </div>
        </div>
    </div>
    {% endfor %}
</div>
