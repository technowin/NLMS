<!-- reports/templates/reports/modals/loan_filters.html -->
<div class="modal fade" id="loanFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Loan Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="loanFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control datepicker" name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control datepicker" name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Type</label>
                                <select class="form-select" name="membership_type" >
                                    <!-- Will be populated dynamically -->
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Overdue Status</label>
                                <select class="form-select" name="overdue">
                                    <option value="">All</option>
                                    <option value="overdue">Overdue Only</option>
                                    <option value="not_overdue">Not Overdue</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Fine Status</label>
                        <select class="form-select" name="fine_status">
                            <option value="">Both</option>
                            <option value="paid">Paid</option>
                            <option value="not_paid">Not Paid</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyLoanFilters()">Apply Filters</button>
                <button type="button" class="btn btn-outline-danger" onclick="clearLoanFilters()">Clear All</button>
            </div>
        </div>
    </div>
</div>
