<!-- reports/templates/reports/modals/loan_filters.html -->
<div class="modal fade" id="loanFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Loan Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="loanFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control datepicker" name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control datepicker" name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Type</label>
                                <select class="form-control" name="membership_type[]" multiple>
                                    <option value="">--Select Types--</option>
                                    {% for mt in membership_types %}
                                        <option value="{{ mt.id }}">
                                            {{ mt.membership_type_en }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Overdue</label>
                                <select class="form-select" name="overdue">
                                    <option value="">All</option>
                                    <option value="0_3">0–3 Days</option>
                                    <option value="4_7">4–7 Days</option>
                                    <option value="1_month">More than 1 Month</option>
                                    <option value="3_month">More than 3 Months</option>
                                    <option value="6_month">More than 6 Months</option>
                                </select>
                            </div>

                        </div>
                    </div>
                    
                    {% comment %} <div class="mb-3">
                        <label class="form-label">Fine Status</label>
                        <select class="form-select" name="fine_status">
                            <option value="">All</option>
                            <option value="paid">Paid</option>
                            <option value="not_paid">Not Paid</option>
                        </select>
                    </div> {% endcomment %}
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" onclick="applyRightFilters('loan','loanFilter')">Apply Filters</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="clearRightFilters('loan','loanFilter')">Clear All</button>
            </div>
        </div>
    </div>
</div>
