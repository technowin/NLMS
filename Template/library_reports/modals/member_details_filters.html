<!-- Member Details Filter Modal -->
<div class="modal fade" id="memberDetailsFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-sliders me-2"></i>Member Details Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="memberDetailsFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Month From</label>
                                <input type="month" class="form-control" 
                                       name="membership_month_from">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Month To</label>
                                <input type="month" class="form-control" 
                                       name="membership_month_to">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Type</label>
                                <select class="form-control" name="membership_type[]" multiple >
                                    <option value="">--Select Types--</option>
                                    {% for mt in membership_types %}
                                        <option value="{{ mt.id }}">
                                            {{ mt.membership_type_en }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Ward</label>
                                <select class="form-control" name="ward[]" multiple>
                                    <option value="">--Select Ward--</option>
                                    {% for w in ward_list %}
                                        <option value="{{ w.ward_name }}">
                                            {{ w.ward_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-control" name="status[]" multiple>
                                    <option value="">--Select Status--</option>
                                    {% for s in status_list %}
                                        <option value="{{ s.id }}">
                                            {{ s.status_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                                
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Renewal Due Month</label>
                                <input type="month" class="form-control" 
                                       name="renewal_due_month">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Member Type</label>
                        <select class="form-control" name="member_type[]" multiple>
                            <option value="">--Select Types--</option>
                            {% for mt in member_types %}
                                <option value="{{ mt.parameter_id }}">
                                    {{ mt.parameter_value }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" 
                        data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" 
                        onclick="applyRightFilters('member-details', 'memberDetailsFilter')">Apply Filters</button>
                <button type="button" class="btn btn-sm btn-danger" 
                        onclick="clearRightFilters('member-details', 'memberDetailsFilter')">Clear All</button>
            </div>
        </div>
    </div>
</div>
