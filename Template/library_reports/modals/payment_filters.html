<!-- reports/templates/reports/modals/payment_filters.html -->
<div class="modal fade" id="paymentFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i> Payment Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="paymentFilterForm">

                    <!-- Date Range -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">From Date</label>
                            <input type="date" class="form-control" name="from_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">To Date</label>
                            <input type="date" class="form-control" name="to_date">
                        </div>
                    </div>

                    <!-- Membership + Payment Type -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Membership Type</label>
                            <select class="form-control" name="membership_type[]" multiple>
                                <option value="">--Select Types--</option>
                                {% for mt in membership_types %}
                                    <option value="{{ mt.id }}">{{ mt.membership_type_en }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Payment Type</label>
                            <select class="form-select" name="payment_type">
                                <option value="">All</option>
                                <option value="Membership">Membership</option>
                                <option value="Membership Renewed">Membership Renewed</option>
                                <option value="Fine">Fine</option>
                                <option value="Fine and Book Loss">Fine and Book Loss</option>
                                <option value="Loss">Loss</option>
                            </select>
                        </div>
                    </div>

                    <!-- Mode + Method -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Payment Mode</label>
                            <select class="form-select" name="payment_mode">
                                <option value="">All</option>
                                <option value="Online">Online</option>
                                <option value="Offline">Offline</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Payment Method</label>
                            <select class="form-select" name="payment_method">
                                <option value="">All</option>
                                <option value="Cash/Cheque/Other">Cash/Cheque/Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Amount Range -->
                    {% comment %} <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Min Amount</label>
                            <input type="number" class="form-control" name="min_amount">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Max Amount</label>
                            <input type="number" class="form-control" name="max_amount">
                        </div>
                    </div> {% endcomment %}

                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary"
                        onclick="applyRightFilters('payments','paymentFilter')">
                    Apply Filters
                </button>
                <button class="btn btn-outline-danger"
                        onclick="clearRightFilters('payments','paymentFilter')">
                    Clear All
                </button>
            </div>

        </div>
    </div>
</div>
