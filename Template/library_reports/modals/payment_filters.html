<!-- reports/templates/reports/modals/payment_filters.html -->
<div class="modal fade" id="paymentFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Payment Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="paymentFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control datepicker" name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control datepicker" name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Type</label>
                                <select class="form-select" name="membership_type" >
                                    <!-- Will be populated dynamically -->
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Payment Type</label>
                                <select class="form-select" name="payment_type">
                                    <option value="">All Types</option>
                                    <option value="deposit">Deposit</option>
                                    <option value="entry_fee">Entry Fee</option>
                                    <option value="subscription">Subscription</option>
                                    <option value="fine">Fine</option>
                                    <option value="renewal">Renewal</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Payment Mode</label>
                                <select class="form-select" name="payment_mode">
                                    <option value="">All Modes</option>
                                    <option value="cash">Cash</option>
                                    <option value="cheque">Cheque</option>
                                    <option value="online">Online</option>
                                    <option value="card">Card</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Payment Method</label>
                                <select class="form-select" name="payment_method">
                                    <option value="">All Methods</option>
                                    <option value="razorpay">Razorpay</option>
                                    <option value="paytm">Paytm</option>
                                    <option value="bank_transfer">Bank Transfer</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Minimum Amount</label>
                        <input type="number" class="form-control" name="min_amount" 
                               placeholder="Enter minimum amount...">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Maximum Amount</label>
                        <input type="number" class="form-control" name="max_amount" 
                               placeholder="Enter maximum amount...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyPaymentFilters()">
                    Apply Filters
                </button>
                <button type="button" class="btn btn-outline-danger" onclick="clearPaymentFilters()">
                    Clear All
                </button>
            </div>
        </div>
    </div>
</div>
