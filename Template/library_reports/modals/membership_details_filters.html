<!-- reports/templates/reports/modals/membership_details_filters.html -->
<div class="modal fade" id="membershipDetailsFilterModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Membership Details Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="membershipDetailsFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control datepicker" 
                                       name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control datepicker" 
                                       name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Gap Period</label>
                                <select class="form-select" name="gap_period">
                                    <option value="">Any</option>
                                    <option value="has_gap">Has Gap Period</option>
                                    <option value="no_gap">No Gap Period</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Action Performed</label>
                                <input type="text" class="form-control" 
                                       name="action_performed" 
                                       placeholder="Enter admin username...">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Membership Type</label>
                        <select class="form-select" name="membership_type" multiple>
                            <!-- Options will be loaded dynamically -->
                        </select>
                        <small class="text-muted">Hold Ctrl to select multiple</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" 
                        data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" 
                        onclick="applyMembershipDetailsFilters()">Apply Filters</button>
                <button type="button" class="btn btn-outline-danger" 
                        onclick="clearMembershipDetailsFilters()">Clear All</button>
            </div>
        </div>
    </div>
</div>
