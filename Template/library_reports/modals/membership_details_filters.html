<!-- reports/templates/reports/modals/membership_details_filters.html -->
<div class="modal fade" id="membershipDetailsFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Membership Details Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="membershipDetailsFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control datepicker" 
                                       name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control datepicker" 
                                       name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Gap Period</label>
                                <select class="form-select" name="gap_period">
                                    <option value="">Any</option>
                                    <option value="no_gap">No Gap </option>
                                    <option value="has_gap">Has Gap </option>
                                    <option value="1_3">Gap 1–3 Months </option>
                                    <option value="4_6">Gap 4–6 Months </option>
                                    <option value="6_plus">Above 6 Months </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Action Performed</label>
                                <select class="form-select" name="action_performed">
                                    <option value="">All</option>
                                    {% for a in actionperformed_list %}
                                        <option value="{{ a.actionperformed }}">
                                            {{ a.actionperformed }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Membership Type</label>
                        <select class="form-control" name="membership_type[]" multiple>
                            <option value="">--Select Types--</option>
                            {% for mt in membership_types %}
                                <option value="{{ mt.id }}">
                                    {{ mt.membership_type_en }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" 
                        data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" 
                        onclick="applyRightFilters('membership-details','membershipDetailsFilter')">Apply Filters</button>
                <button type="button" class="btn btn-danger" 
                        onclick="clearRightFilters('membership-details','membershipDetailsFilter')">Clear All</button>
            </div>
        </div>
    </div>
</div>
