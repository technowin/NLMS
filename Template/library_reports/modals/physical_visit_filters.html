<!-- reports/templates/reports/modals/physical_visit_filters.html -->
<div class="modal fade" id="physicalVisitFilterModal" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-funnel me-2"></i>Physical Visit Filters
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="physicalVisitFilterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control datepicker" name="from_date">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control datepicker" name="to_date">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Membership Type</label>
                                <select class="form-control" name="membership_type[]" multiple>
                                    <option value="">--Select Types--</option>
                                    {% for mt in membership_types %}
                                        <option value="{{ mt.id }}">
                                            {{ mt.membership_type_en }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Activity</label>
                                <select class="form-select" name="activity_type">
                                    <option value="">All</option>
                                    <option value="reading">Reading</option>
                                    <option value="issue">Issue</option>
                                    <option value="return">Return</option>
                                </select>
                            </div>

                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Search in Remarks</label>
                        <input type="text" class="form-control" name="remarks_search" 
                               placeholder="Search in remarks...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyRightFilters('physical-visit','physicalVisitFilter')">
                    Apply Filters
                </button>
                <button type="button" class="btn btn-outline-danger" onclick="clearRightFilters('physical-visit','physicalVisitFilter')">
                    Clear All
                </button>
            </div>
        </div>
    </div>
</div>
