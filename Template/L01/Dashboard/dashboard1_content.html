<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let dailyChart, eodChart, transactionTable, currentLabel, currentDetailType, footfallChart,physicalFootfallChart;

// ------------------- RENDER DASHBOARD 1 -------------------
function renderDashboard1(data) {
    if (data.start_date && data.end_date) {
        $('#from_date').val(data.start_date);
        $('#to_date').val(data.end_date);
    }

    if (data.daily) {
        renderDailyTransactionChart(data.daily);
    }

    if (data.eod) {
        renderEodChart(data.eod);
    }

    // 🔥 NEW FOOTFALL BAR GRAPH
    if (data.footfall) {
        renderFootfallChart(data.footfall);
    }
      if (data.physical_footfall) {
        renderPhysicalFootfallChart(data.physical_footfall);
    }
}



function renderFootfallChart(footfall) {
    const ctx = document.getElementById('footfallChart');
    if (!ctx) return;

    if (footfallChart) footfallChart.destroy();

    footfallChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: footfall.labels,   // menu names
            datasets: [{
                label: 'Members Logged In',
                data: footfall.counts,
                backgroundColor: '#0d6efd'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            },

            // ✅ ADD THIS
            onClick: (evt, elements) => {
                if (!elements.length) return;

                const index = elements[0].index;
                const menuName = footfall.labels[index];

                // SAME modal + SAME function
                showTransactionTable('footfall_online', menuName);
            }
        }
    });
}


function renderPhysicalFootfallChart(footfall) {
    const ctx = document.getElementById('physicalFootfallChart');
    if (!ctx) return;

    if (physicalFootfallChart) physicalFootfallChart.destroy();

    physicalFootfallChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: footfall.labels,   // dates
            datasets: [{
                label: 'Members Entered',
                data: footfall.counts,
                backgroundColor: '#198754'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            },

            // ✅ ADD THIS
            onClick: (evt, elements) => {
                if (!elements.length) return;

                const index = elements[0].index;
                const label = footfall.labels[index];

                showTransactionTable('footfall_offline', label);
            }
        }
    });
}



// ------------------- RENDER CHARTS -------------------
function renderDailyTransactionChart(daily) {
    const ctx = document.getElementById('dailyTransactionChart');
    if (!ctx) return;
    if (dailyChart) dailyChart.destroy();

    dailyChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Book Issued','Book Returned','Book Due Not Returned','Book Damaged/Lost'],
            datasets: [{ 
                data: [daily.issued, daily.returned, daily.due, daily.damaged], 
                backgroundColor: ['#007bff','#28a745','#ffc107','#dc3545'] 
            }]
        },
        options: {
            responsive: true,
            plugins: { 
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.label}: ${context.raw}`;
                        }
                    }
                }
            },
            scales: { 
                y: { 
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Count'
                    }
                }
            },
            onClick: (evt, elements) => {
                if (!elements.length) return;
                const types = ['issued','returned','due','damaged'];
                const i = elements[0].index;
                showTransactionTable(types[i], dailyChart.data.labels[i]);
            }
        }
    });
}

function renderEodChart(eod) {
    const ctx = document.getElementById('eodChart');
    if (!ctx) return;
    if (eodChart) eodChart.destroy();

    eodChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Monthly Subscription','Total Subscription','Fine Amount','Book Fine Amount'],
            datasets: [{ 
                data: [eod.monthly, eod.total, eod.fine, eod.book_fine], 
                backgroundColor: ['#17a2b8','#6610f2','#fd7e14','#20c997'] 
            }]
        },
        options: {
            responsive: true,
            plugins: { 
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.label}: ₹${context.raw.toLocaleString()}`;
                        }
                    }
                }
            },
            scales: { 
                y: { 
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Amount (₹)'
                    }
                }
            },
            onClick: (evt, elements) => {
                if (!elements.length) return;
                const types = ['monthly','total','fine','book_fine'];
                const i = elements[0].index;
                showTransactionTable(types[i], eodChart.data.labels[i]);
            }
        }
    });
}

// ------------------- SHOW TRANSACTION TABLE -------------------
function showTransactionTable(detailType, label) {
    console.log('showTransactionTable:', detailType, label);

    currentLabel = label;
    currentDetailType = detailType;

    $('#label').val(label);

    $('#transactionModalTitle').text(label + ' Details');

    const modal = new bootstrap.Modal(
        document.getElementById('transactionModal')
    );
    modal.show();

    // Destroy old DataTable if exists
    if ($.fn.DataTable.isDataTable('#transaction-table')) {
        $('#transaction-table').DataTable().destroy();
        $('#transaction-table').empty();
    }

    const fromDate = $('#from_date').val();
    const toDate = $('#to_date').val();

    // 🔥 ONLY ONE CALL — DataTables handles it
    initializeDataTable(detailType, fromDate, toDate, label);
}


// Separate function to initialize DataTable
function initializeDataTable(detailType, fromDate, toDate,label) {
    console.log('initializeDataTable called for:', detailType);
    
    // Define columns
    const columns =
        // ================= PAYMENT (EOD) =================
        ['monthly','total','fine','book_fine'].includes(detailType)
        ? [
            { 
                title: 'Member Code', 
                data: 'member_code',
                className: 'text-center'
            },
            { 
                title: 'Member Name', 
                data: 'member_name',
                className: 'text-start'
            },
            { 
                title: 'Payment Date', 
                data: 'payment_date',
                className: 'text-center',
                render: function(data) {
                    return data ? new Date(data).toLocaleDateString('en-IN') : '';
                }
            },
            { 
                title: 'Amount', 
                data: 'amount',
                className: 'text-end',
                render: function(data) {
                    return '₹' + parseFloat(data || 0).toLocaleString('en-IN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                }
            }
        ]

        // ================= FOOTFALL (ONLINE + OFFLINE) =================
        : ['footfall_online','footfall_offline'].includes(detailType)
        ? [
            {
                title: 'Membership Type',
                data: 'membership_type',
                className: 'text-center'
            },
            {
                title: 'Membership Code',
                data: 'membership_code',
                className: 'text-center'
            },
            {
                title: 'Member Name',
                data: 'member_name',
                className: 'text-start'
            },
            {
                title: 'Login / Entry Time',
                data: 'login_time',
                className: 'text-center',
                render: function(data) {
                    return data ? new Date(data).toLocaleString('en-IN') : '';
                }
            }
        ]

        // ================= CIRCULATION (Issued / Returned / Due / Damaged) =================
        : [
            { 
                title: 'Member Code', 
                data: 'member_code',
                className: 'text-center'
            },
            { 
                title: 'Member Name', 
                data: 'member_name',
                className: 'text-start'
            },
            { 
                title: 'Book Title', 
                data: 'book_name',
                className: 'text-start'
            },
            { 
                title: 'Book Barcode', 
                data: 'book_barcode',
                className: 'text-center'
            },
            { 
                title: 'Date', 
                data: 'date',
                className: 'text-center',
                render: function(data) {
                    return data ? new Date(data).toLocaleDateString('en-IN') : '';
                }
            }
        ];

    
    // Initialize DataTable
    transactionTable = $('#transaction-table').DataTable({
        processing: true,
        serverSide: true,
        ajax: {
            url: '/L01/dashboard/details/',
            type: 'GET',
            data: function(d) {
                // Build parameters
                const params = {
                    label: label,
                    detail_type: detailType,
                    from_date: fromDate,
                    to_date: toDate,
                    draw: d.draw,
                    start: d.start,
                    length: d.length
                };
                
                // Add search parameter
                if (d.search && d.search.value) {
                    params['search[value]'] = d.search.value;
                } else {
                    params['search[value]'] = '';
                }
                
                console.log('Sending to server:', params);
                return params;
            },
            dataSrc: function(json) {
                console.log('Received from server:', json);
                if (json.error) {
                    console.error('Server error:', json.error);
                    return [];
                }
                return json.data;
            },
            error: function(xhr, error, thrown) {
                console.error('DataTables AJAX error:', xhr.responseText);
            }
        },
        columns: columns,
        pageLength: 10,
        lengthMenu: [[10, 25, 50, 100], [10, 25, 50, 100]],
        language: {
            processing: '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>',
            emptyTable: 'No data available in table',
            info: 'Showing _START_ to _END_ of _TOTAL_ entries',
            infoEmpty: 'Showing 0 to 0 of 0 entries',
            infoFiltered: '(filtered from _MAX_ total entries)',
            lengthMenu: 'Show _MENU_ entries',
            loadingRecords: 'Loading...',
            search: 'Search:',
            zeroRecords: 'No matching records found'
        }
    });
}
// ------------------- APPLY BUTTON -------------------
function reloadDashboard1FromParent() {
    // Get filter values
    const fromDate = $('#from_date').val();
    const toDate = $('#to_date').val();
    
    // Debug: Check if showLoading function exists
    console.log('showLoading function exists:', typeof showLoading === 'function');
    
    // Build URL with filter parameters
    let url = `/L01/dashboard/data/1/`;
    if (fromDate && toDate) {
        url += `?from_date=${fromDate}&to_date=${toDate}`;
    }
    
    // Show loading overlay
    if (typeof showLoading === 'function') {
        console.log('Showing loader...');
        showLoading(true);
    } else {
        // Fallback if showLoading is not defined
        console.warn('showLoading function not found, using fallback');
        $('#loaderOverlay').addClass('active');
    }
    
    // Load Dashboard 1 with filters
    $.ajax({
        url: url,
        type: 'GET',
        dataType: 'json',
        success: function(data) {
            console.log('Dashboard data loaded successfully');
            
            try {
                // Try to handle the data
                if (typeof handleDashboardData === 'function') {
                    handleDashboardData('1', data);
                } else {
                    console.warn('handleDashboardData function not found');
                    // Fallback: Directly update the container
                    if (data.html) {
                        $('#dashboard1-content').html(data.html);
                    }
                }
                
                // Update timestamp if available
                if (data.last_updated) {
                    updateLastUpdated(data.last_updated);
                }
                
            } catch (error) {
                console.error('Error in handleDashboardData:', error);
                alert('Error processing dashboard data: ' + error.message);
            }
            
        },
        error: function(xhr, status, error) {
            console.error('AJAX Error reloading dashboard:', status, error, xhr.responseText);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Failed to load dashboard data. Please try again.',
                confirmButtonColor: 'var(--primary-color)'
            });
        },
        complete: function() {
            console.log('AJAX request complete, hiding loader...');
            
            // ALWAYS hide loader in complete callback (runs after success/error)
            if (typeof showLoading === 'function') {
                showLoading(false);
            } else {
                // Fallback
                $('#loaderOverlay').removeClass('active');
            }
            
            // Double-check after a short delay (in case of async operations)
            setTimeout(() => {
                if ($('#loaderOverlay').hasClass('active')) {
                    console.warn('Loader still active after timeout, forcing hide');
                    $('#loaderOverlay').removeClass('active');
                }
            }, 1000); // 1 second delay
        }
    });
}

</script>

<script>
$('#excelBtn').on('click', function () {
    downloadReport('excel');
});

$('#pdfBtn').on('click', function () {
    downloadReport('pdf');
});

function downloadReport(format) {
    if (!currentDetailType) {
        alert('No data type selected');
        return;
    }

    const fromDate = $('#from_date').val();
    const toDate = $('#to_date').val();
    const label = $('#label').val();

    const url = `/L01/dashboard/export/?` +
        `detail_type=${currentDetailType}` +
        `&from_date=${fromDate}` +
        `&to_date=${toDate}` +
        `&label=${label}` +
        `&format=${format}`;

    // IMPORTANT: normal redirect to force download
    window.location.href = url;
}

$('#todayTasksModal').on('show.bs.modal', function () {
    if (window.returnedBooks && window.returnedBooks.length) {
        renderReturnedBooksTable(window.returnedBooks);
    } else {
        $('#returnedBooksTable tbody').html(
            '<tr><td colspan="2">No books returned today.</td></tr>'
        );
    }
});



function renderReturnedBooksTable(returnedBooks) {
    let rows = '';
    let ids = [];

    if (!returnedBooks || !returnedBooks.length) {
        rows = `<tr><td colspan="2">No books returned today.</td></tr>`;
    } else {
        returnedBooks.forEach(t => {
            rows += `
                <tr>
                    <td>
                        ${t.catalog__title}
                        <br>
                        <small class="text-muted">Barcode: ${t.barcode}</small>
                    </td>
                    <td>
                        <input type="checkbox" name="shelved_${t.id}" value="1">
                        <input type="hidden" name="catalog_${t.id}" value="${t.catalog__id}">
                        <input type="hidden" name="barcode_${t.id}" value="${t.barcode}">
                    </td>
                </tr>
            `;
            ids.push(t.id);
        });
    }

    $('#returnedBooksTable tbody').html(rows);
    $('#all_ids').val(ids.join(','));
}

</script>
