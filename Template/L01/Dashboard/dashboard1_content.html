<!-- dashboard1_content.html - FIXED VERSION -->
<!-- ================= FILTER CARD ================= -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="fw-bold">From Date</label>
                <input type="date" id="from_date" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="fw-bold">To Date</label>
                <input type="date" id="to_date" class="form-control">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-primary w-100" onclick="reloadDashboard1FromParent()">
                    Apply
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ================= DASHBOARD 1 CONTAINER ================= -->
<div id="transaction_container" class="row">
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="fw-bold mb-3">Daily Transaction</h5>
                <canvas id="dailyTransactionChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="fw-bold mb-3">EOD (End Of Day)</h5>
                <canvas id="eodChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- ================= TRANSACTION MODAL ================= -->
<div class="modal fade" id="transactionModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="transactionModalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex justify-content-end mb-3 gap-2">
                    <button class="btn btn-success btn-sm" id="excelBtn">Excel</button>
                    <button class="btn btn-danger btn-sm" id="pdfBtn">PDF</button>
                </div>
                <table id="transaction-table" class="table table-bordered table-striped w-100"></table>
            </div>
        </div>
    </div>
</div>

<script>
let dailyChart, eodChart, transactionTable, currentLabel, currentDetailType;

// ------------------- RENDER DASHBOARD 1 -------------------
function renderDashboard1(data) {
    // Set filter dates if provided
    if (data.start_date && data.end_date) {
        $('#from_date').val(data.start_date);
        $('#to_date').val(data.end_date);
    }
    
    if (data.daily) {
        renderDailyTransactionChart(data.daily);
    } else {
        $('#transaction_container').html('<div class="alert alert-warning">No daily transaction data available</div>');
    }

    if (data.eod) {
        renderEodChart(data.eod);
    } else {
        $('#transaction_container').append('<div class="alert alert-warning">No EOD data available</div>');
    }
}

// ------------------- RENDER CHARTS -------------------
function renderDailyTransactionChart(daily) {
    const ctx = document.getElementById('dailyTransactionChart');
    if (!ctx) return;
    if (dailyChart) dailyChart.destroy();

    dailyChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Book Issued','Book Returned','Book Due Not Returned','Book Damaged/Lost'],
            datasets: [{ 
                data: [daily.issued, daily.returned, daily.due, daily.damaged], 
                backgroundColor: ['#007bff','#28a745','#ffc107','#dc3545'] 
            }]
        },
        options: {
            responsive: true,
            plugins: { 
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.label}: ${context.raw}`;
                        }
                    }
                }
            },
            scales: { 
                y: { 
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Count'
                    }
                }
            },
            onClick: (evt, elements) => {
                if (!elements.length) return;
                const types = ['issued','returned','due','damaged'];
                const i = elements[0].index;
                showTransactionTable(types[i], dailyChart.data.labels[i]);
            }
        }
    });
}

function renderEodChart(eod) {
    const ctx = document.getElementById('eodChart');
    if (!ctx) return;
    if (eodChart) eodChart.destroy();

    eodChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Monthly Subscription','Total Subscription','Fine Amount','Book Fine Amount'],
            datasets: [{ 
                data: [eod.monthly, eod.total, eod.fine, eod.book_fine], 
                backgroundColor: ['#17a2b8','#6610f2','#fd7e14','#20c997'] 
            }]
        },
        options: {
            responsive: true,
            plugins: { 
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.label}: ₹${context.raw.toLocaleString()}`;
                        }
                    }
                }
            },
            scales: { 
                y: { 
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Amount (₹)'
                    }
                }
            },
            onClick: (evt, elements) => {
                if (!elements.length) return;
                const types = ['monthly','total','fine','book_fine'];
                const i = elements[0].index;
                showTransactionTable(types[i], eodChart.data.labels[i]);
            }
        }
    });
}

// ------------------- SHOW TRANSACTION TABLE -------------------
// ------------------- SHOW TRANSACTION TABLE -------------------
// ------------------- SHOW TRANSACTION TABLE -------------------
function showTransactionTable(detailType, label) {
    console.log('showTransactionTable called with:', detailType, label);
    
    currentLabel = label;
    currentDetailType = detailType;
    
    // Set modal title
    $('#transactionModalTitle').text(label + ' Details');
    
    // Show the modal first
    const modalElement = document.getElementById('transactionModal');
    const modal = new bootstrap.Modal(modalElement);
    modal.show();
    
    // Clear existing table content
    $('#transaction-table').html(`
        <thead>
            <tr>
                ${['monthly','total','fine','book_fine'].includes(detailType) 
                    ? '<th>Member Code</th><th>Member Name</th><th>Payment Date</th><th>Amount</th>'
                    : '<th>Member Code</th><th>Member Name</th><th>Book Title</th><th>Book Barcode</th><th>Date</th>'
                }
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="${['monthly','total','fine','book_fine'].includes(detailType) ? '4' : '5'}" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    Loading data...
                </td>
            </tr>
        </tbody>
    `);
    
    // Destroy existing DataTable if it exists
    if ($.fn.DataTable.isDataTable('#transaction-table')) {
        $('#transaction-table').DataTable().destroy();
        $('#transaction-table').empty();
    }
    
    // Get filter values
    const fromDate = $('#from_date').val();
    const toDate = $('#to_date').val();
    
    console.log('Filters - From:', fromDate, 'To:', toDate);
    
    // Test AJAX call first to see if data is coming
    $.ajax({
        url: '/L01/dashboard/details/',
        type: 'GET',
        data: {
            detail_type: detailType,
            from_date: fromDate,
            to_date: toDate,
            draw: 1,
            start: 0,
            length: 10,
            'search[value]': ''
        },
        success: function(response) {
            console.log('AJAX Response:', response);
            
            if (response.error) {
                $('#transaction-table').html(`
                    <div class="alert alert-danger">
                        Error: ${response.error}
                    </div>
                `);
                return;
            }
            
            // If data is returned, initialize DataTable
            if (response.data && response.data.length > 0) {
                initializeDataTable(detailType, fromDate, toDate);
            } else {
                $('#transaction-table').html(`
                    <div class="alert alert-info">
                        No data found for the selected criteria.
                    </div>
                `);
            }
        },
        error: function(xhr, status, error) {
            console.error('AJAX Error:', error);
            console.error('Response:', xhr.responseText);
            
            $('#transaction-table').html(`
                <div class="alert alert-danger">
                    Failed to load data. Please check console for details.
                    <br>Error: ${error}
                </div>
            `);
        }
    });
}

// Separate function to initialize DataTable
function initializeDataTable(detailType, fromDate, toDate) {
    console.log('initializeDataTable called for:', detailType);
    
    // Define columns
    const columns = ['monthly','total','fine','book_fine'].includes(detailType) 
        ? [
            { 
                title: 'Member Code', 
                data: 'member_code',
                className: 'text-center'
            },
            { 
                title: 'Member Name', 
                data: 'member_name',
                className: 'text-start'
            },
            { 
                title: 'Payment Date', 
                data: 'payment_date',
                className: 'text-center',
                render: function(data) {
                    if (data) {
                        return new Date(data).toLocaleDateString('en-IN');
                    }
                    return '';
                }
            },
            { 
                title: 'Amount', 
                data: 'amount',
                className: 'text-end',
                render: function(data) {
                    return '₹' + parseFloat(data || 0).toLocaleString('en-IN', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                }
            }
        ]
        : [
            { 
                title: 'Member Code', 
                data: 'member_code',
                className: 'text-center'
            },
            { 
                title: 'Member Name', 
                data: 'member_name',
                className: 'text-start'
            },
            { 
                title: 'Book Title', 
                data: 'book_name',
                className: 'text-start'
            },
            { 
                title: 'Book Barcode', 
                data: 'book_barcode',
                className: 'text-center'
            },
            { 
                title: 'Date', 
                data: 'date',
                className: 'text-center',
                render: function(data) {
                    if (data) {
                        return new Date(data).toLocaleDateString('en-IN');
                    }
                    return '';
                }
            }
        ];
    
    // Initialize DataTable
    transactionTable = $('#transaction-table').DataTable({
        processing: true,
        serverSide: true,
        ajax: {
            url: '/L01/dashboard/details/',
            type: 'GET',
            data: function(d) {
                // Build parameters
                const params = {
                    detail_type: detailType,
                    from_date: fromDate,
                    to_date: toDate,
                    draw: d.draw,
                    start: d.start,
                    length: d.length
                };
                
                // Add search parameter
                if (d.search && d.search.value) {
                    params['search[value]'] = d.search.value;
                } else {
                    params['search[value]'] = '';
                }
                
                console.log('Sending to server:', params);
                return params;
            },
            dataSrc: function(json) {
                console.log('Received from server:', json);
                if (json.error) {
                    console.error('Server error:', json.error);
                    return [];
                }
                return json.data;
            },
            error: function(xhr, error, thrown) {
                console.error('DataTables AJAX error:', xhr.responseText);
            }
        },
        columns: columns,
        pageLength: 10,
        lengthMenu: [[10, 25, 50, 100], [10, 25, 50, 100]],
        language: {
            processing: '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>',
            emptyTable: 'No data available in table',
            info: 'Showing _START_ to _END_ of _TOTAL_ entries',
            infoEmpty: 'Showing 0 to 0 of 0 entries',
            infoFiltered: '(filtered from _MAX_ total entries)',
            lengthMenu: 'Show _MENU_ entries',
            loadingRecords: 'Loading...',
            search: 'Search:',
            zeroRecords: 'No matching records found'
        }
    });
}
// ------------------- APPLY BUTTON -------------------
function reloadDashboard1FromParent() {
    // Get filter values
    const fromDate = $('#from_date').val();
    const toDate = $('#to_date').val();
    
    // Build URL with filter parameters
    let url = `/L01/dashboard/data/1/`;
    if (fromDate && toDate) {
        url += `?from_date=${fromDate}&to_date=${toDate}`;
    }
    
    // Show loading overlay
    if (typeof showLoading === 'function') {
        showLoading(true);
    }
    
    // Load Dashboard 1 with filters
    $.ajax({
        url: url,
        type: 'GET',
        dataType: 'json',
        success: function(data) {
            if (typeof handleDashboardData === 'function') {
                handleDashboardData('1', data);
                updateLastUpdated(data.last_updated || new Date().toLocaleString());
            }
            if (typeof showLoading === 'function') {
                showLoading(false);
            }
        },
        error: function(xhr, status, error) {
            console.error('Error reloading dashboard:', error);
            alert('Error loading dashboard data');
            if (typeof showLoading === 'function') {
                showLoading(false);
            }
        }
    });
}

// Initialize date inputs with today's date
$(document).ready(function() {
    const today = new Date().toISOString().split('T')[0];
    $('#from_date').val(today);
    $('#to_date').val(today);
});
</script>
