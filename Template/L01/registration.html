{% extends "Shared/landingPageLayout.html" %}
{% load static %}

{% block content %}

    <div class="est-info-wrapper">
        <h2><i class="bi bi-person-badge"></i> Fill Membership Details / सदस्य माहिती भरा</h2>

        <form id="membershipForm" method="post">
            {% csrf_token %}

            <!-- FIRST NAME -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label">First Name (English)</label>
                    <input type="text" name="first_name" class="form-control translate-marathi-input" placeholder="e.g. Pruthvi" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">पहिले नाव (Marathi)</label>
                    <input type="text" name="first_name_mar" class="form-control translate-marathi-output" placeholder="उदा. पृथ्वी" required>
                </div>
            </div>

            <!-- MIDDLE NAME -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label">Middle Name (English)</label>
                    <input type="text" name="middle_name" class="form-control translate-marathi-input" placeholder="e.g. Narendra">
                </div>
                <div class="col-md-6">
                    <label class="form-label">मधले नाव (Marathi)</label>
                    <input type="text" name="middle_name_mar" class="form-control translate-marathi-output" placeholder="उदा. नरेंद्र">
                </div>
            </div>

            <!-- LAST NAME -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label">Last Name (English)</label>
                    <input type="text" name="last_name" class="form-control translate-marathi-input" placeholder="e.g. Hajare">
                </div>
                <div class="col-md-6">
                    <label class="form-label">आडनाव (Marathi)</label>
                    <input type="text" name="last_name_mar" class="form-control translate-marathi-output" placeholder="उदा. हजारे">
                </div>
            </div>

            <div class="text-center mt-4 d-flex justify-content-center gap-3 flex-wrap">
                <button type="submit" class="btn btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Submit / सबमिट करा
                </button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        $(document).ready(function () {
            $('.translate-marathi-input').on('blur', function () {
                const csrfToken = $('input[name="csrfmiddlewaretoken"]').val(); // CSRF token
                const input = $(this);
                const text = input.val().trim();

                if (text !== "") {
                    $.ajax({
                        url: "{% url 'translate_word' %}",   // hits your Django function
                        type: "GET",
                        data: { q: text },
                        headers: { "X-CSRFToken": csrfToken },
                        success: function(response) {
                            // Fill the Marathi input in the same row
                            input.closest('.row').find('.translate-marathi-output').val(response.translated || text);
                        },
                        error: function() {
                            // fallback: keep original text
                            input.closest('.row').find('.translate-marathi-output').val(text);
                        }
                    });
                }
            });
        });
    </script>


{% endblock %}
